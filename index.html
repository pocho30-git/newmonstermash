<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Mash Survivor</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
    background:radial-gradient(circle at center,#222,#111);
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    font-size:20px;
    line-height:1.5;
}

#upgradeMenu{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    background:#222;
    border:4px solid white;
    border-radius:20px;
    padding:20px;
    z-index:20;
    display:none;
    text-align:center;
}

.upgradeBtn{
    background:#444;
    margin:10px 0;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-size:20px;
}

.upgradeBtn:hover{
    background:#666;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    display:none;
    z-index:30;
}

button{
    padding:10px 20px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
❤️ HP: <span id="hp">100</span><br>
⚔️ Round: <span id="round">1</span><br>
👾 Enemies: <span id="left">0</span><br>
⭐ Level: <span id="level">1</span><br>
🛡️ Guards: <span id="guardCount">0</span>/<span id="maxGuards">0</span><br>
<span id="mirrorUI" style="display:none">👥 Mirror ('E'): <span id="mirrorCD">READY</span></span>
</div>

<div id="upgradeMenu">
<h2>Choose An Upgrade</h2>
<div id="choices"></div>
</div>

<div id="gameOver">
<h1>GAME OVER</h1>
<button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const keys = {};
const mouse = {x:0,y:0};

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;
    
    // Ability Keybinds
    if(e.key.toLowerCase() === 'e' && !paused && abilities.mirror) {
        usePhantomMirror();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove",e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

const player = {
    x:canvas.width/2,
    y:canvas.height/2,
    r:20,
    speed:4,
    hp:100,
    damage:15,
    fireRate:320,
    bullets:[],
    level:1
};

const abilities = {
    speedArrows:null,
    bubbles:null,
    feathers:null,
    bananas:null,
    pizza:null,
    darkEnergy:null,
    guards:null,
    mirror: null,      // Active Decoy
    repulsion: null    // Passive Shield
};

let enemies = [];
let guards = []; 
let damageTexts = [];
let round = 1;
let paused = false;

// Time tracker for visual rotations/pulsing
let gameTick = 0;

class Enemy{
    constructor(){
        this.r = 20;
        this.color = `hsl(${Math.random()*360},80%,60%)`;
        this.flash = 0;
        
        this.baseSpeed = 1 + round * 0.05; 
        this.speed = this.baseSpeed;
        this.hp = 35 + round * 8;

        let safeSpawn = false;
        while(!safeSpawn) {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            
            let distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
            if(distToPlayer > 250) {
                safeSpawn = true;
            }
        }
    }

    update(){
        let targetX = player.x;
        let targetY = player.y;

        // If a phantom mirror is active, monsters prioritize the decoy
        if (abilities.mirror && abilities.mirror.decoyActive) {
            targetX = abilities.mirror.decoyX;
            targetY = abilities.mirror.decoyY;
        }

        let dx = targetX - this.x;
        let dy = targetY - this.y;
        let dist = Math.hypot(dx,dy);

        if (dist > 0) {
            this.x += dx/dist * this.speed;
            this.y += dy/dist * this.speed;
        }

        // Only damage the actual player
        if(dist < this.r + player.r && (!abilities.mirror || !abilities.mirror.decoyActive)){
            player.hp -= 0.15;
        }

        if(this.flash > 0){
            this.flash--;
        }
        
        this.speed = this.baseSpeed; 
    }

    draw(){
        ctx.fillStyle = this.flash > 0 ? "white" : this.color;

        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(this.x-6,this.y-5,3,0,Math.PI*2);
        ctx.arc(this.x+6,this.y-5,3,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x,this.y+3,7,0,Math.PI);
        ctx.stroke();
    }
}

// Logic for using the Phantom Mirror ability
function usePhantomMirror() {
    if (abilities.mirror.cooldown > 0 || abilities.mirror.decoyActive) return;

    // Place decoy at player's current location
    abilities.mirror.decoyX = player.x;
    abilities.mirror.decoyY = player.y;
    abilities.mirror.decoyActive = true;
    
    // Decoy lasts 6 seconds (360 frames at 60 FPS)
    setTimeout(() => {
        abilities.mirror.decoyActive = false;
        // Mirror is on cooldown for 15 seconds after despawning
        abilities.mirror.cooldown = 900; 
        document.getElementById("mirrorCD").textContent = "15s";
    }, 6000);
}

// Draw the stationary Phantom Mirror decoy
function drawPhantomMirrorDecoy() {
    if (!abilities.mirror || !abilities.mirror.decoyActive) return;

    ctx.save();
    // Decoy is a darker grey and translucent version of player
    ctx.fillStyle = "rgba(77, 77, 77, 0.6)"; 
    ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
    ctx.lineWidth = 4;
    
    ctx.beginPath();
    ctx.arc(abilities.mirror.decoyX, abilities.mirror.decoyY, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Pulse effect to show it is a projection
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    let pulse = Math.sin(gameTick * 0.1) * 8;
    ctx.beginPath();
    ctx.arc(abilities.mirror.decoyX, abilities.mirror.decoyY, player.r + 5 + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// Handle the active Repulsion Field passive
function handleRepulsionField() {
    if (!abilities.repulsion) return;

    let fieldRad = abilities.repulsion.radius;
    let pushPower = 0.8; // Strength of the push

    enemies.forEach(e => {
        let dx = e.x - player.x;
        let dy = e.y - player.y;
        let dist = Math.hypot(dx, dy);

        // If enemy is inside the shield bubble, apply dynamic pushback vector
        if (dist < fieldRad + e.r) {
            let normalizedX = dx / dist;
            let normalizedY = dy / dist;
            // Constant push force away from center
            e.x += normalizedX * pushPower;
            e.y += normalizedY * pushPower;
            
            // Visual indicator enemy is interacting with the shield
            if (gameTick % 10 === 0 && Math.random() < 0.2) {
                damageTexts.push(new DamageText(e.x, e.y, "•", "rgba(200,200,200,0.5)"));
            }
        }
    });
}

// Draw the visual Repulsion Field swirling around the player
function drawRepulsionFieldVisual() {
    if (!abilities.repulsion) return;

    ctx.save();
    let rad = abilities.repulsion.radius;
    let swirlyGrey = "rgba(160, 160, 160, 0.15)";
    
    ctx.translate(player.x, player.y);
    // Swirling rotation over time
    ctx.rotate(gameTick * 0.04); 

    // Main translucent grey bubble
    ctx.fillStyle = swirlyGrey;
    ctx.beginPath();
    ctx.arc(0, 0, rad, 0, Math.PI * 2);
    ctx.fill();

    // Swirling visual accents/rings
    ctx.strokeStyle = "rgba(200, 200, 200, 0.4)";
    ctx.lineWidth = 2;
    ctx.setLineDash([15, 20]); // Dashed lines give swirling effect
    ctx.beginPath();
    ctx.arc(0, 0, rad - 5, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.rotate(-gameTick * 0.08); // Counter-rotation inner ring
    ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
    ctx.setLineDash([30, 5]);
    ctx.beginPath();
    ctx.arc(0, 0, rad - 15, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

class Guard {
    constructor(x, y, role) {
        this.x = x;
        this.y = y;
        this.r = 14;
        this.speed = 3.5;
        this.role = role;
        
        if(this.role === "healer") {
            this.color = "#ff47b6";
            this.healCooldown = 0;
            this.pulseRadius = 0;
        } else if(this.role === "shooter") {
            this.color = "#47f3ff";
            this.shootCooldown = 0;
        } else if(this.role === "bomber") {
            this.color = "#ff8147";
            this.speed = 4.5;
        } else {
            this.color = "#47ff9c";
            this.damage = 1.5;
        }
    }

    update() {
        if (this.role === "healer") {
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 50) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }

            if (this.pulseRadius > 0) this.pulseRadius += 4;
            if (this.pulseRadius > 100) this.pulseRadius = 0;

            this.healCooldown++;
            if (this.healCooldown >= 90) {
                this.healCooldown = 0;
                this.pulseRadius = 1;
                if (player.hp < 100) {
                    player.hp = Math.min(100, player.hp + 6);
                    damageTexts.push(new DamageText(player.x, player.y - 30, "+6 HP", "#47ff9c"));
                }
            }
        } 
        else if (this.role === "shooter") {
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 60) {
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
            }

            this.shootCooldown++;
            if (this.shootCooldown >= 45) {
                let target = nearestEnemy(this.x, this.y);
                if (target) {
                    this.shootCooldown = 0;
                    let angle = Math.atan2(target.y - this.y, target.x - this.x);
                    player.bullets.push(
                        new Projectile(
                            this.x, this.y,
                            Math.cos(angle) * 8, Math.sin(angle) * 8,
                            5, "#47f3ff", 12, "bullet"
                        )
                    );
                }
            }
        } 
        else if (this.role === "bomber") {
            let target = nearestEnemy(this.x, this.y);
            if (target) {
                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                if (dist < this.r + target.r) {
                    this.explode();
                }
            } else {
                let dx = player.x - this.x;
                let dy = player.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 40) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
        } 
        else if (this.role === "melee") {
            let target = nearestEnemy(this.x, this.y);
            if (target) {
                let dx = target.x - this.x;
                let dy = target.y - this.y;
                let dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                if (dist < this.r + target.r) {
                    damageEnemy(target, this.damage, dx / dist, dy / dist, "guard");
                    if (target.hp <= 0) {
                        let index = enemies.indexOf(target);
                        if (index > -1) enemies.splice(index, 1);
                    }
                }
            } else {
                let dx = player.x - this.x;
                let dy = player.y - this.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 40) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
        }
    }

    explode() {
        let blastRadius = 110;
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dist = Math.hypot(e.x - this.x, e.y - this.y);
            if (dist < blastRadius) {
                let angle = Math.atan2(e.y - this.y, e.x - this.x);
                damageEnemy(e, 75, Math.cos(angle), Math.sin(angle), "bullet");
                if (e.hp <= 0) {
                    enemies.splice(i, 1);
                }
            }
        }
        
        damageTexts.push(new DamageText(this.x, this.y, "BOOM!", "#ff8147"));
        let index = guards.indexOf(this);
        if (index > -1) guards.splice(index, 1);
    }

    draw() {
        ctx.save();
        if (this.role === "healer" && this.pulseRadius > 0) {
            ctx.strokeStyle = `rgba(71, 255, 156, ${1 - this.pulseRadius/100})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.pulseRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = this.color;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.arc(this.x, this.y + 2, 6, 0, Math.PI, true);
        ctx.lineTo(this.x, this.y - 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

class Projectile{
    constructor(x,y,dx,dy,size,color,damage,type){
        this.x=x;
        this.y=y;
        this.dx=dx;
        this.dy=dy;
        this.size=size;
        this.color=color;
        this.damage=damage;
        this.life=300;
        this.type=type;
        this.returning=false;
        this.rotation=0;
    }

    update(){
        this.x += this.dx;
        this.y += this.dy;
        this.life--;
        this.rotation += 0.15;
    }

    draw(){
        ctx.save();
        ctx.translate(this.x,this.y);
        ctx.rotate(this.rotation);

        if(this.type === "bullet"){
            ctx.fillStyle = this.color || "yellow";
            ctx.beginPath();
            ctx.arc(0,0,this.size,0,Math.PI*2);
            ctx.fill();
        }
        else if(this.type === "banana"){
            ctx.fillStyle = "gold";
            ctx.beginPath();
            ctx.arc(0,0,12,0.3,2.7);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "gold";
            ctx.stroke();
        }
        else if(this.type === "pizza"){
            ctx.fillStyle = "orange";
            ctx.beginPath();
            ctx.moveTo(-14,-12);
            ctx.lineTo(14,0);
            ctx.lineTo(-14,12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(-4,-2,2,0,Math.PI*2);
            ctx.arc(-2,5,2,0,Math.PI*2);
            ctx.arc(2,0,2,0,Math.PI*2);
            ctx.fill();
        }
        else if(this.type === "feather"){
            ctx.fillStyle = "lime";
            ctx.beginPath();
            ctx.ellipse(0,0,5,14,0,0,Math.PI*2);
            ctx.fill();

            ctx.strokeStyle = "cyan";
            ctx.beginPath();
            ctx.moveTo(0,-10);
            ctx.lineTo(0,10);
            ctx.stroke();
        }
        else if(this.type === "bubble"){
            ctx.fillStyle = "rgba(120,220,255,0.5)";
            ctx.strokeStyle = "skyblue";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0,0,this.size,0,Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }
        else if(this.type === "arrow"){
            ctx.fillStyle = "cyan";
            ctx.beginPath();
            ctx.moveTo(12,0);
            ctx.lineTo(-10,-5);
            ctx.lineTo(-10,5);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }
}

class DamageText{
    constructor(x,y,text,color){
        this.x=x;
        this.y=y;
        this.text=text;
        this.color=color;
        this.life=50;
    }

    update(){
        this.y -= 1;
        this.life--;
    }

    draw(){
        ctx.fillStyle = this.color;
        ctx.font = "bold 18px Arial";
        ctx.fillText(this.text,this.x,this.y);
    }
}

function damageEnemy(enemy,damage,dx,dy,sourceType){
    enemy.hp -= damage; 
    enemy.flash = 4;

    if(sourceType !== "guard" && sourceType !== "darkEnergy") {
        enemy.x += dx * 6;
        enemy.y += dy * 6;
    }

    let displayDamage = Math.floor(damage);
    if (displayDamage === 0 && Math.random() < 0.15) {
        displayDamage = 1; 
    }

    if (displayDamage > 0) {
        damageTexts.push(
            new DamageText(
                enemy.x + (Math.random()*20-10),
                enemy.y - 20,
                "-" + displayDamage,
                "white"
            )
        );
    }
}

function spawnWave(){
    enemies = [];
    let amount = 5 + round * 3;

    for(let i=0; i<amount; i++){
        enemies.push(new Enemy());
    }
    updateUI();
}

function spawnRandomGuard() {
    const roles = ["healer", "shooter", "melee", "bomber"];
    const randomRole = roles[Math.floor(Math.random() * roles.length)];
    guards.push(new Guard(player.x, player.y, randomRole));
}

spawnWave();

function nearestEnemy(x,y){
    let closest = null;
    let best = Infinity;

    enemies.forEach(e=>{
        let d = Math.hypot(e.x-x,e.y-y);
        if(d < best){
            best = d;
            closest = e;
        }
    });
    return closest;
}

let lastShotTime = 0;
function handlePlayerShooting(timestamp) {
    if(!paused && timestamp - lastShotTime >= player.fireRate) {
        lastShotTime = timestamp;
        let angle = Math.atan2(mouse.y-player.y,mouse.x-player.x);
        player.bullets.push(
            new Projectile(
                player.x, player.y,
                Math.cos(angle)*9, Math.sin(angle)*9,
                5, "yellow", player.damage, "bullet"
            )
        );
    }
}

// SPEED ARROWS
setInterval(()=>{
    if(paused || !abilities.speedArrows) return;

    let mx = 0;
    let my = 0;

    if(keys["w"]) my -= 1;
    if(keys["s"]) my += 1;
    if(keys["a"]) mx -= 1;
    if(keys["d"]) mx += 1;

    if(mx===0 && my===0) return;

    let angle = Math.atan2(my,mx);

    for(let i=0;i<abilities.speedArrows.count;i++){
        let spread = (i-(abilities.speedArrows.count-1)/2)*0.25;
        player.bullets.push(
            new Projectile(
                player.x,
                player.y,
                Math.cos(angle+spread)*12,
                Math.sin(angle+spread)*12,
                6,
                "cyan",
                12,
                "arrow"
            )
        );
    }
},500);

// BUBBLES
setInterval(()=>{
    if(paused || !abilities.bubbles) return;

    for(let i=0;i<abilities.bubbles.level;i++){
        player.bullets.push(
            new Projectile(
                player.x,
                player.y,
                (Math.random()-0.5)*4,
                -3-Math.random()*2,
                12+abilities.bubbles.level*2,
                "skyblue",
                18,
                "bubble"
            )
        );
    }
},1200);

// FEATHERS
setInterval(()=>{
    if(paused || !abilities.feathers) return;

    let target = nearestEnemy(player.x,player.y);
    if(!target) return;

    let angle = Math.atan2(target.y-player.y,target.x-player.x);

    for(let i=0;i<abilities.feathers.level;i++){
        let spread = (Math.random()-0.5)*0.4;
        player.bullets.push(
            new Projectile(
                player.x,
                player.y,
                Math.cos(angle+spread)*10,
                Math.sin(angle+spread)*10,
                7,
                "lime",
                18,
                "feather"
            )
        );
    }
},700);

// BANANAS
setInterval(()=>{
    if(paused || !abilities.bananas) return;

    let target = nearestEnemy(player.x,player.y);
    if(!target) return;

    let angle = Math.atan2(target.y-player.y,target.x-player.x);

    let banana = new Projectile(
        player.x,
        player.y,
        Math.cos(angle)*7,
        Math.sin(angle)*7,
        12,
        "gold",
        26,
        "banana"
    );
    banana.curve = 0.08;
    player.bullets.push(banana);
},1400);

// PIZZA
setInterval(()=>{
    if(paused || !abilities.pizza) return;

    let angle = Math.atan2(mouse.y-player.y,mouse.x-player.x);

    let pizza = new Projectile(
        player.x,
        player.y,
        Math.cos(angle)*8,
        Math.sin(angle)*8,
        15,
        "orange",
        35,
        "pizza"
    );
    pizza.returning = false;
    player.bullets.push(pizza);
},2000);

function update(){
    if(paused) return;
    
    gameTick++;

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    player.x = Math.max(player.r,Math.min(canvas.width-player.r,player.x));
    player.y = Math.max(player.r,Math.min(canvas.height-player.r,player.y));

    // Handle Active Abilities Logic
    if(abilities.darkEnergy){
        enemies.forEach((e,ei)=>{
            let dist = Math.hypot(player.x-e.x,player.y-e.y);

            if(dist < abilities.darkEnergy.radius){
                e.speed = e.baseSpeed * 0.5;

                let dx = (e.x-player.x)/dist;
                let dy = (e.y-player.y)/dist;

                damageEnemy(e, abilities.darkEnergy.damage, dx, dy, "darkEnergy");

                if(e.hp <= 0){
                    enemies.splice(ei,1);
                }
            }
        });
    }
    
    // Process Mirror Cooldown Timer
    if (abilities.mirror && abilities.mirror.cooldown > 0 && !abilities.mirror.decoyActive) {
        abilities.mirror.cooldown--;
        // Update UI every second
        if (abilities.mirror.cooldown % 60 === 0) {
            let sLeft = Math.ceil(abilities.mirror.cooldown / 60);
            document.getElementById("mirrorCD").textContent = sLeft + "s";
            if (sLeft === 0) document.getElementById("mirrorCD").textContent = "READY";
        }
    }
    
    // Process Passive Repulsion logic
    handleRepulsionField();

    for (let i = guards.length - 1; i >= 0; i--) {
        if(guards[i]) guards[i].update();
    }

    player.bullets.forEach((b,bi)=>{
        b.update();

        if(b.curve){
            b.dy += b.curve;
        }

        if(b.type === "pizza"){
            if(!b.returning && b.life < 180){
                b.returning = true;
            }
            if(b.returning){
                let dx = player.x - b.x;
                let dy = player.y - b.y;
                let dist = Math.hypot(dx,dy);

                b.dx += dx/dist * 0.3;
                b.dy += dy/dist * 0.3;
            }
        }

        enemies.forEach((e,ei)=>{
            let dist = Math.hypot(b.x-e.x,b.y-e.y);

            if(dist < b.size + e.r){
                let dx = (e.x-b.x)/dist;
                let dy = (e.y-b.y)/dist;

                damageEnemy(e,b.damage,dx,dy,"bullet");

                if(b.type !== "pizza"){
                    player.bullets.splice(bi,1);
                }

                if(e.hp <= 0){
                    enemies.splice(ei,1);
                }
            }
        });

        if(b.life <= 0){
            player.bullets.splice(bi,1);
        }
    });

    damageTexts.forEach((d,i)=>{
        d.update();
        if(d.life <= 0){
            damageTexts.splice(i,1);
        }
    });

    enemies.forEach(e=>e.update());

    if(enemies.length === 0){
        paused = true;
        showUpgrades();
    }

    if(player.hp <= 0){
        paused = true;
        document.getElementById("gameOver").style.display = "block";
    }

    updateUI();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // Draw Active Decoy first (background layer)
    drawPhantomMirrorDecoy();

    if(abilities.darkEnergy){
        let g = ctx.createRadialGradient(
            player.x,
            player.y,
            10,
            player.x,
            player.y,
            abilities.darkEnergy.radius
        );

        g.addColorStop(0,"rgba(150,0,255,0.45)");
        g.addColorStop(1,"rgba(150,0,255,0)");

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(player.x, player.y, abilities.darkEnergy.radius, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Draw Repulsion visual swirly rings around player
    drawRepulsionFieldVisual();

    ctx.fillStyle = "#4de1ff";
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y);
    ctx.lineTo(mouse.x,mouse.y);
    ctx.stroke();

    player.bullets.forEach(b=>b.draw());
    guards.forEach(g => g.draw());
    enemies.forEach(e=>e.draw());
    damageTexts.forEach(d=>d.draw());
}

function loop(timestamp){
    handlePlayerShooting(timestamp);
    update();
    draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

function updateUI(){
    document.getElementById("hp").textContent = Math.max(0, Math.floor(player.hp));
    document.getElementById("round").textContent = round;
    document.getElementById("left").textContent = enemies.length;
    document.getElementById("level").textContent = player.level;
    
    document.getElementById("guardCount").textContent = guards.length;
    document.getElementById("maxGuards").textContent = abilities.guards ? abilities.guards.max : 0;
}

function showUpgrades(){
    const menu = document.getElementById("upgradeMenu");
    const choices = document.getElementById("choices");

    menu.style.display = "block";
    choices.innerHTML = "";

    const upgrades = [
        {
            name:"⚡ Faster Shooting",
            effect:()=>{ player.fireRate = Math.max(60, player.fireRate - 55); }
        },
        {
            name:"💥 More Damage",
            effect:()=>{ player.damage += 12; }
        },
        {
            name:"👟 More Speed",
            effect:()=>{ player.speed += 0.8; }
        },
        {
            name:"❤️ Heal",
            effect:()=>{ player.hp = Math.min(100, player.hp + 30); }
        },
        {
            name:"🏹 Speeding Arrows",
            effect:()=>{
                if(!abilities.speedArrows){ abilities.speedArrows = {count:1}; } 
                else { abilities.speedArrows.count = Math.min(5,abilities.speedArrows.count+1); }
            }
        },
        {
            name:"🫧 Booing Bubbles",
            effect:()=>{
                if(!abilities.bubbles){ abilities.bubbles = {level:1}; } 
                else { abilities.bubbles.level++; }
            }
        },
        {
            name:"🦚 Peacock Feathers",
            effect:()=>{
                if(!abilities.feathers){ abilities.feathers = {level:1}; } 
                else { abilities.feathers.level++; }
            }
        },
        {
            name:"🍌 Cruin Bananas",
            effect:()=>{
                if(!abilities.bananas){ abilities.bananas = {level:1}; } 
                else { abilities.bananas.level++; }
            }
        },
        {
            name:"🍕 Boomerang Pizza",
            effect:()=>{
                if(!abilities.pizza){ abilities.pizza = {level:1}; } 
                else { abilities.pizza.level++; }
            }
        },
        {
            name:"🌑 Dark Energy",
            effect:()=>{
                if(!abilities.darkEnergy){
                    abilities.darkEnergy = { radius:80, damage:0.85 };
                } else {
                    abilities.darkEnergy.radius += 20;
                    abilities.darkEnergy.damage += 0.45;
                }
            }
        },
        {
            name:"🛡️ Guard Capacity +1",
            effect:()=>{
                if(!abilities.guards){ 
                    abilities.guards = { max: 1 }; 
                } else { 
                    abilities.guards.max += 1; 
                }
                spawnRandomGuard();
            }
        },
        // NEW ABILITIES
        {
            name:"👥 Phantom Mirror ('E')",
            effect:()=>{
                if(!abilities.mirror){ 
                    // Init ability structure
                    abilities.mirror = { 
                        cooldown: 0, 
                        decoyActive: false,
                        decoyX: 0,
                        decoyY: 0
                    }; 
                    // Show Ability UI
                    document.getElementById("mirrorUI").style.display = "block";
                } else {
                    // Reduce cooldown slightly if already owned
                    abilities.mirror.cooldown = 0; // instantly ready
                    document.getElementById("mirrorCD").textContent = "READY";
                }
            }
        },
        {
            name:"🌀 Repulsion Field",
            effect:()=>{
                if(!abilities.repulsion){ 
                    abilities.repulsion = { radius: 75 }; 
                } else {
                    // Increase range if already owned
                    abilities.repulsion.radius += 25;
                }
            }
        }
    ];

    upgrades.sort(()=>Math.random()-0.5);

    for(let i=0;i<3;i++){
        const up = upgrades[i];
        const div = document.createElement("div");

        div.className = "upgradeBtn";
        div.innerHTML = up.name;

        div.onclick = ()=>{
            up.effect();
            menu.style.display = "none";
            round++;
            player.level++;
            paused = false;
            spawnWave();
        };
        choices.appendChild(div);
    }
}
</script>
